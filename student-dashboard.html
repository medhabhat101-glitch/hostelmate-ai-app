<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b43f5" />
  <title>Student Dashboard — HostelMate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-role="student">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <a class="brand side-brand" href="#"><span class="brand-mark">⌂</span><span>HostelMate <b>AI</b></span></a>
      <div class="role-switch"><span class="role-avatar" id="roleAvatar">👩🏻‍🎓</span><div><b id="roleName">Chiranthan L</b><small id="roleLabel">Student account</small></div></div>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item active" data-view="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-view="complaints"><span>⌁</span> Complaints <em id="complaintNavCount">2</em></button>
        <button class="nav-item" data-view="mess"><span>♨</span> Mess menu & feedback</button>
        <button class="nav-item" data-view="leave"><span>↗</span> Leave requests</button>
        <button class="nav-item" data-view="announcements"><span>✳</span> Announcements</button>
        <button class="nav-item" data-view="lostfound"><span>⌕</span> Lost &amp; Found <em id="lostFoundNavCount">0</em></button>
        <button class="nav-item" data-view="booking"><span>◷</span> Facility booking <em id="bookingNavCount">0</em></button>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><span>✦</span><b>Need a hand?</b><p>Hostel life can be busy. We're here to help.</p><button data-view="announcements">View updates →</button></div><button class="nav-item logout" id="logoutBtn"><span>↩</span> Log out</button></div>
    </aside>
    <main class="app-main">
      <header class="app-topbar"><div><span class="crumb">Workspace /</span> <b id="pageTitle">Dashboard</b></div><div class="topbar-right"><span class="today-label" id="todayLabel"></span><button class="icon-button" id="notificationBtn" aria-label="Notifications">♧<i></i></button><div class="top-user"><span id="topAvatar">👩🏻‍🎓</span><b id="topUserName">Chiranthan</b></div></div></header>
      <div class="app-content" id="viewRoot"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="genericModal"><div class="modal" id="genericModalBody"></div></div>
  <script src="js/app.js"></script>
</body>
</html>
